version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/packages/zest-astro"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/packages/zest-eleventy"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
